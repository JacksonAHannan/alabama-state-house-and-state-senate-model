<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vote Smart Multi-axis Adjudication</title>
<style>
:root{--ink:#17211b;--muted:#66716a;--paper:#f4f0e6;--card:#fffdf8;--line:#d8d1c2;--green:#245c42;--red:#963e32;--blue:#315d82;--gold:#b88225}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,sans-serif}.shell{max-width:1240px;margin:auto;padding:20px}h1,h2,h3{font-family:Georgia,serif}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.sub,.muted{color:var(--muted)}.progress{min-width:270px;text-align:right}.bar{height:8px;background:#ddd5c7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}.filters,.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters{margin:15px 0;padding:11px;background:#e9e3d6;border:1px solid var(--line);border-radius:10px}.filters input{flex:1;min-width:220px}select,input,textarea,button{font:inherit}select,input,textarea{border:1px solid #bdb4a5;border-radius:7px;padding:8px;background:white}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(430px,.9fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 10px #4037200a}.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{font-size:12px;background:#eee7da;border-radius:20px;padding:4px 9px}.question{color:var(--muted);margin:14px 0 8px}.option{font:700 21px/1.3 Georgia,serif;margin-bottom:16px}.candidates{border-top:1px solid var(--line);padding-top:10px;max-height:120px;overflow:auto;font-size:13px;color:var(--muted)}.proposal{border-left:4px solid var(--blue);padding:9px 11px;margin:8px 0;background:#f0f4f5;border-radius:5px;font-size:13px}.proposal.escalation{border-color:var(--gold)}.proposal b{display:block}.choice{display:flex;gap:8px}.choice button,.nav button,.add,.save{border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}.choice button{flex:1;background:#e6ece8}.choice button.active{outline:3px solid var(--gold)}.effect{display:grid;grid-template-columns:1.15fr 1fr .75fr 34px;gap:6px;margin:8px 0}.effect button{border:0;border-radius:7px;color:var(--red);cursor:pointer}.add{background:#e5edf4;color:var(--blue)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.fields>*{width:100%}textarea{width:100%;min-height:66px}.save{width:100%;margin-top:9px;background:var(--green);color:white}.nav{justify-content:space-between;margin-top:11px}.nav button{background:#ded7ca}.empty{text-align:center;padding:70px 20px}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:white;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s}.toast.show{opacity:1}.hint{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:880px){.layout{grid-template-columns:1fr}.top{display:block}.progress{text-align:left;margin-top:10px}.effect{grid-template-columns:1fr 1fr}.effect button{min-height:36px}}
</style></head><body><main class="shell">
<header class="top"><div><h1>Vote Smart position adjudication</h1><div class="sub">Descriptive, multi-axis policy coding—no forced left/right label</div></div><div class="progress"><b id="progressText">Loading…</b><div class="bar"><i id="progressBar"></i></div><small id="version"></small></div></header>
<section class="filters"><select id="statusFilter"><option value="pending">Pending only</option><option value="all">All items</option><option value="reviewed">Reviewed only</option></select><select id="yearFilter"><option value="all">All years</option></select><select id="sectionFilter"><option value="all">All sections</option></select><input id="search" placeholder="Search wording or candidate"><button id="nextPending">Next pending</button></section>
<div id="app"><section class="card empty">Loading review queue…</section></div><div class="toast" id="toast"></div>
</main><script>
let items=[],decisions={},axes={},domains=[],filtered=[],index=0,draft={};
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function parseEffects(v){try{return Array.isArray(v)?v:JSON.parse(v||'[]')}catch(e){return[]}}
async function load(){try{const r=await fetch('/api/items');if(!r.ok)throw Error(`HTTP ${r.status}`);const d=await r.json();items=d.items;decisions=d.decisions;axes=d.axes;domains=d.domains;$('version').textContent=`Ontology ${d.ontology_version}`;populate();applyFilters()}catch(e){$('progressText').textContent='Unable to load';$('app').innerHTML=`<section class="card empty"><b>Could not load the queue.</b><br>${esc(e.message)}<br><br>Restart the Python server and refresh.</section>`}}
function populate(){[...new Set(items.map(x=>x.election_year))].sort().forEach(v=>$('yearFilter').insertAdjacentHTML('beforeend',`<option>${v}</option>`));[...new Set(items.map(x=>x.section))].sort().forEach(v=>$('sectionFilter').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`))}
function reviewed(x){return decisions[x.review_id]&&decisions[x.review_id].decision!=='skip'}
function applyFilters(){const st=$('statusFilter').value,y=$('yearFilter').value,s=$('sectionFilter').value,q=$('search').value.toLowerCase();filtered=items.filter(x=>(st==='all'||(st==='pending'&&!reviewed(x))||(st==='reviewed'&&reviewed(x)))&&(y==='all'||x.election_year==y)&&(s==='all'||x.section===s)&&(!q||(x.option_text+' '+x.question+' '+x.candidates.join(' ')).toLowerCase().includes(q)));index=Math.min(index,Math.max(0,filtered.length-1));render()}
function proposals(x){const rows=x.multiaxis_models||[];let html=rows.map(m=>{const effects=parseEffects(m.effects_json).map(e=>`${esc(e.axis)} = ${esc(e.pole)}`).join('; ')||'no effects';return `<div class="proposal ${m.stage==='escalation'?'escalation':''}"><b>${esc(m.model)} · ${esc(m.stage)}</b>${esc(m.primary_domain)} · ${effects}<br><span class="muted">${esc(m.plain_english_policy||m.review_reason)}</span></div>`}).join('');const old=x.legacy_decision||{};if(old.decision)html+=`<div class="proposal"><b>Legacy manual review · context only</b>${esc(old.decision)} · ${esc(old.dimension)} ${esc(old.affirmative_direction)}<br><span class="muted">${esc(old.reviewer_notes)}</span></div>`;return html||'<div class="muted">No proposals available.</div>'}
function effectRow(e={},n=0){const axis=e.axis||Object.keys(axes)[0],poles=axes[axis]||[];return `<div class="effect" data-n="${n}"><select class="axis">${Object.keys(axes).map(a=>`<option ${a===axis?'selected':''}>${a}</option>`).join('')}</select><select class="pole">${poles.map(p=>`<option ${p===e.pole?'selected':''}>${p}</option>`).join('')}</select><select class="strength"><option ${e.strength!=='secondary'?'selected':''}>primary</option><option ${e.strength==='secondary'?'selected':''}>secondary</option></select><button class="remove" title="Remove">×</button></div>`}
function render(){const done=items.filter(reviewed).length;$('progressText').textContent=`${done} / ${items.length} adjudicated`;$('progressBar').style.width=`${items.length?100*done/items.length:0}%`;if(!filtered.length){$('app').innerHTML='<section class="card empty">No items match these filters.</section>';return}const x=filtered[index],saved=decisions[x.review_id]||{};draft={decision:saved.decision||'adjudicated',primary_domain:saved.primary_domain||'',policy_domains:parseEffects(saved.policy_domains_json),policy_key:saved.policy_key||'',effects:parseEffects(saved.effects_json),confidence:saved.confidence||'medium',reviewer_notes:saved.reviewer_notes||''};$('app').innerHTML=`<div class="layout"><section class="card"><div class="meta"><span class="pill">${x.election_year}</span><span class="pill">${esc(x.section)}</span><span class="pill">${x.candidate_count} candidates</span><span class="pill">${x.selected_response_count} responses</span></div><div class="question">${esc(x.question)}</div><div class="option">${esc(x.option_text)}</div><div class="candidates"><b>Affected candidates:</b> ${x.candidates.map(esc).join(', ')}</div><h3>Model proposals</h3>${proposals(x)}</section><aside class="card"><h2 style="margin-top:0">Adjudication</h2><div class="choice"><button data-decision="adjudicated">Substantive position</button><button data-decision="non_substantive">Non-substantive</button></div><div class="fields"><select id="domain"><option value="">Primary domain…</option>${domains.map(d=>`<option ${draft.primary_domain===d?'selected':''}>${d}</option>`).join('')}</select><select id="confidence"><option ${draft.confidence==='high'?'selected':''}>high</option><option ${draft.confidence==='medium'?'selected':''}>medium</option><option ${draft.confidence==='low'?'selected':''}>low</option></select><input id="policyKey" value="${esc(draft.policy_key)}" placeholder="policy_key"></div><div class="hint">Aggregated domains: ${draft.policy_domains.map(esc).join(', ')||'none'}</div><h3>Position effects</h3><div id="effects">${draft.effects.map(effectRow).join('')}</div><button class="add" id="addEffect">+ Add effect</button><div class="hint">An item may have multiple independent effects. Axis poles are descriptive—not conservative/progressive scores.</div><textarea id="notes" placeholder="Reviewer notes">${esc(draft.reviewer_notes)}</textarea><button class="save" id="save">Save and next ↵</button><div class="nav"><button id="prev">← Previous</button><span>${index+1} / ${filtered.length}</span><button id="next">Next →</button></div></aside></div>`;bind();selectDecision(draft.decision)}
function bind(){document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>selectDecision(b.dataset.decision));$('addEffect').onclick=()=>{draft.effects.push({});renderEffects()};$('domain').onchange=e=>draft.primary_domain=e.target.value;$('confidence').onchange=e=>draft.confidence=e.target.value;$('policyKey').oninput=e=>draft.policy_key=e.target.value;$('notes').oninput=e=>draft.reviewer_notes=e.target.value;$('save').onclick=save;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);bindEffects()}
function bindEffects(){document.querySelectorAll('.effect').forEach((row,n)=>{row.querySelector('.axis').onchange=e=>{draft.effects[n].axis=e.target.value;draft.effects[n].pole=axes[e.target.value][0];renderEffects()};row.querySelector('.pole').onchange=e=>draft.effects[n].pole=e.target.value;row.querySelector('.strength').onchange=e=>draft.effects[n].strength=e.target.value;row.querySelector('.remove').onclick=()=>{draft.effects.splice(n,1);renderEffects()}})}
function renderEffects(){$('effects').innerHTML=draft.effects.map(effectRow).join('');bindEffects()}
function selectDecision(d){draft.decision=d;document.querySelectorAll('[data-decision]').forEach(b=>b.classList.toggle('active',b.dataset.decision===d))}
async function save(){const x=filtered[index];draft.primary_domain=$('domain').value;draft.confidence=$('confidence').value;draft.policy_key=$('policyKey').value;draft.reviewer_notes=$('notes').value;document.querySelectorAll('.effect').forEach((r,n)=>{draft.effects[n]={axis:r.querySelector('.axis').value,pole:r.querySelector('.pole').value,strength:r.querySelector('.strength').value,rationale:''}});if(draft.decision==='adjudicated'&&!draft.primary_domain)return toast('Choose a primary domain');const payload={review_id:x.review_id,election_year:x.election_year,normalized_option:x.normalized_option,decision:draft.decision,primary_domain:draft.primary_domain,policy_domains_json:JSON.stringify(draft.policy_domains||[]),policy_key:draft.policy_key,effects_json:JSON.stringify(draft.effects),confidence:draft.confidence,reviewer_notes:draft.reviewer_notes};$('save').disabled=true;try{const r=await fetch('/api/adjudicate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!d.ok)throw Error(d.error);decisions[x.review_id]=payload;toast('Saved');if($('statusFilter').value==='pending')applyFilters();else move(1)}catch(e){$('save').disabled=false;toast(e.message)}}
function move(n){index=Math.max(0,Math.min(filtered.length-1,index+n));render();scrollTo({top:0,behavior:'smooth'})}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
['statusFilter','yearFilter','sectionFilter'].forEach(id=>$(id).onchange=applyFilters);$('search').oninput=applyFilters;$('nextPending').onclick=()=>{$('statusFilter').value='pending';index=0;applyFilters()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='Enter')save();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});load();
</script></body></html>
